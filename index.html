<title>Painel Diniz Prévia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Playfair+Display:wght@700&display=swap">
<style>
  :root {
    --red: #D0151C; --red-dark: #8B0E13; --red-tint: #FBE9E9;
    --ink: #2F2E2E; --ink-2: #4A4948; --muted: #6F6D6B; --faint: #9A9896;
    --line: #E4E2DF; --rule: #2F2E2E; --track: #EDEBE8; --ground: #FFFFFF; --panel: #F7F6F4;
    --good: #3E8E5A; --warn: #B8760A;
    --gap: 32px; --gap-y: 40px;
    --serif: "Playfair Display", Georgia, "Times New Roman", serif;
    --sans: Poppins, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  html { color-scheme: light; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: var(--red); font-weight: 500; text-decoration: none; }
  a:hover { color: var(--red-dark); text-decoration: underline; }
  button { font: inherit; color: inherit; }
  :is(a, button, input, select, [tabindex]):focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }
  h1, h2 { text-wrap: balance; }

  /* cabeçalho */
  .top { background: var(--ground); border-bottom: 1px solid var(--line); position: sticky; top: 44px; z-index: 5; }
  .top-in { max-width: 1400px; margin: 0 auto; padding: 0 40px; height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
  .brand .word { font-family: var(--serif); font-weight: 700; font-size: 27px; color: var(--red); letter-spacing: 1px; }
  .brand .sub { font-size: 10.5px; font-weight: 500; letter-spacing: 2.2px; text-transform: uppercase; color: var(--muted); }
  .right { display: flex; align-items: center; gap: 28px; min-width: 0; }
  .tabs { display: flex; gap: 26px; font-size: 14px; font-weight: 500; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 23px 0 21px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--red); border-bottom-color: var(--red); }
  .tab.discreto { font-size: 12px; color: var(--muted); }
  .tools { display: flex; align-items: center; gap: 12px; }
  select.month { border: 1px solid var(--ink); border-radius: 3px; padding: 8px 12px; font: inherit; font-size: 13px; font-weight: 500; background: var(--ground); color: var(--ink); min-height: 38px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid #C7C5C2; border-radius: 3px; padding: 8px 12px; font-size: 13px; font-weight: 500; background: var(--ground); color: var(--ink); cursor: pointer; min-height: 38px; white-space: nowrap; }
  .btn:hover { border-color: var(--ink); }
  .btn.red { background: var(--red); border-color: var(--red); color: #FFFFFF; }
  .btn.red:hover { background: var(--red-dark); border-color: var(--red-dark); }
  .btn.sm { border: 0; padding: 4px 0; min-height: 28px; font-size: 12px; color: var(--muted); background: transparent; }
  .btn.sm:hover { color: var(--red); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn svg { flex-shrink: 0; }
  .status { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); display: inline-block; }
  .dot.on { background: var(--good); }

  /* página */
  .wrap { max-width: 1400px; margin: 0 auto; padding: 40px 40px 88px; }
  .wrap > section { display: flex; flex-direction: column; gap: var(--gap-y); }
  .draft { position: sticky; top: 0; z-index: 7; background: var(--red); color: #FFFFFF; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 6px 16px; font-size: 12.5px; font-weight: 500; text-align: center; }
  .draft b { font-weight: 700; font-size: 14px; letter-spacing: 3px; border: 1.5px solid rgba(255,255,255,0.85); padding: 2px 10px; line-height: 1.4; }
  .titlebar { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .titlebar h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.2px; line-height: 1.2; }
  .titlebar .src { font-size: 12px; color: var(--muted); }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); }
  .grid21 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: var(--gap); }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }

  /* blocos: filete superior, sem caixa */
  .card { border-top: 1px solid var(--rule); padding: 18px 0 0; display: flex; flex-direction: column; gap: 16px; min-width: 0; background: transparent; }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0; line-height: 1.3; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .card-head .grow { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }

  /* indicadores */
  .kpi { border-top: 3px solid var(--red); padding-top: 14px; gap: 6px; min-height: 128px; box-sizing: border-box; }
  .kpi .lbl { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 1.4px; }
  .kpi .val { font-size: 32px; font-weight: 600; letter-spacing: -0.6px; line-height: 1.05; }
  .kpi .note { font-size: 12px; color: var(--muted); }
  .kpi .inline { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .meter { height: 5px; background: var(--track); overflow: hidden; margin-top: 4px; }
  .meter > span { display: block; height: 100%; background: var(--red); }
  .redtxt { color: var(--red); } .goodtxt { color: var(--good); } .warntxt { color: var(--warn); } .mutedtxt { color: var(--muted); }
  .explain { font-size: 12px; color: var(--muted); line-height: 1.55; }

  /* listas com barras */
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .sw { width: 9px; height: 9px; display: inline-block; }
  .rows { display: flex; flex-direction: column; gap: 9px; font-size: 13px; }
  .row, .rowh { display: grid; grid-template-columns: 250px minmax(0, 1fr) 70px 90px; gap: 0 14px; align-items: center; }
  .r5 { grid-template-columns: 230px minmax(0, 1fr) 64px 84px 90px; }
  .rowh { font-size: 10.5px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 1px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { display: flex; gap: 2px; height: 12px; }
  .bar > i { display: block; height: 100%; }
  .r { text-align: right; } .b { font-weight: 600; }
  .split { display: flex; flex-direction: column; gap: 14px; font-size: 13px; }
  .split .item { display: flex; flex-direction: column; gap: 6px; }
  .split .lab { display: flex; justify-content: space-between; gap: 12px; }
  .split .lab .b { white-space: nowrap; }
  .track { height: 9px; background: var(--track); overflow: hidden; }
  .track > span { display: block; height: 100%; }
  .divider { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
  .divider .lab { display: flex; justify-content: space-between; gap: 12px; }
  .divider .lab span:first-child { color: var(--muted); }
  .areas { display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
  .area { display: grid; grid-template-columns: 96px minmax(0, 1fr) 64px 44px; gap: 10px; align-items: center; }
  .area .track { height: 11px; }
  .alerts { display: flex; flex-direction: column; gap: 12px; font-size: 13px; }
  .alert { display: flex; gap: 10px; align-items: flex-start; }
  .alert svg { flex-shrink: 0; margin-top: 1px; }
  .alert .t1 { font-weight: 500; }
  .alert .t2 { color: var(--muted); font-size: 12px; }
  .badge { font-size: 11px; font-weight: 600; color: #FFFFFF; background: var(--red); padding: 1px 7px; margin-left: 6px; vertical-align: middle; }
  .badge.zero { background: var(--good); }
  .empty { flex-grow: 1; border: 1px dashed #C7C5C2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; text-align: center; min-height: 160px; }
  .empty .t1 { font-size: 13px; font-weight: 500; }
  .empty .t2 { font-size: 12px; color: var(--muted); line-height: 1.5; max-width: 36ch; }

  /* tabelas */
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 10px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
  th { font-size: 10.5px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 1px; background: var(--ground); position: sticky; top: 0; border-bottom: 1px solid var(--rule); }
  th.r, td.r { text-align: right; }
  th.sort { cursor: pointer; }
  th.sort:hover { color: var(--ink); }
  th.sort.on { color: var(--red); }
  td.name { white-space: normal; min-width: 220px; }
  tbody tr:hover td { background: var(--panel); }
  tr.neg td { background: var(--red-tint); }
  tr.int td { color: var(--muted); }
  input.money { width: 96px; border: 1px solid #C7C5C2; border-radius: 3px; padding: 5px 8px; font: inherit; font-size: 13px; text-align: right; background: var(--ground); }
  input.money:focus { border-color: var(--red); }
  .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 6px; background: var(--track); color: var(--ink); }
  .pill.good { background: #E3F0E7; color: #245C38; } .pill.warn { background: #F4E9D3; color: #6E4508; } .pill.bad { background: var(--red-tint); color: var(--red-dark); }
  .filters { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  input.search { border: 1px solid #C7C5C2; border-radius: 3px; padding: 8px 12px; font: inherit; font-size: 13px; min-width: 240px; min-height: 38px; box-sizing: border-box; background: var(--ground); }
  input.search:focus { border-color: var(--ink); }
  label.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
  .mini { font-size: 12px; color: var(--muted); }
  .twin { display: flex; flex-direction: column; line-height: 1.2; }
  .twin small { font-size: 11px; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--ink); border-radius: 3px; overflow: hidden; }
  .seg button { border: 0; background: var(--ground); padding: 5px 12px; font-size: 12px; font-weight: 500; cursor: pointer; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #FFFFFF; }

  /* formulários */
  .drop { border: 1px dashed #C7C5C2; padding: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--panel); }
  .drop.ok { border-color: var(--good); border-style: solid; }
  .drop .t1 { font-weight: 600; font-size: 13px; }
  .drop .t2 { font-size: 12px; color: var(--muted); }
  .drop input[type="file"] { font-size: 12px; }
  .drop .res { font-size: 12px; color: var(--ink); }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .field input, .field select { border: 1px solid #C7C5C2; border-radius: 3px; padding: 8px 10px; font: inherit; font-size: 13px; color: var(--ink); background: var(--ground); min-height: 38px; box-sizing: border-box; }
  .field input:focus, .field select:focus { border-color: var(--ink); }
  .inline-fields { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
  .svgchart { width: 100%; height: auto; display: block; }
  .sim { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--gap); align-items: start; }
  .sim .f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .sim .f input, .sim .f select { border: 1px solid #C7C5C2; border-radius: 3px; padding: 8px 10px; font: inherit; font-size: 13px; color: var(--ink); background: var(--ground); min-height: 38px; box-sizing: border-box; }
  .sim .f input:focus, .sim .f select:focus { border-color: var(--ink); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid #C7C5C2; border-radius: 3px; padding: 6px 12px; font-size: 12px; font-weight: 500; cursor: pointer; background: var(--ground); min-height: 34px; color: var(--ink-2); }
  .chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #FFFFFF; }
  .hours { display: grid; grid-template-columns: 110px minmax(0, 1fr) minmax(0, 1fr); gap: 8px 12px; align-items: center; font-size: 13px; }
  .hours .h { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .hours input { width: 100%; border: 1px solid #C7C5C2; border-radius: 3px; padding: 7px 10px; font: inherit; font-size: 13px; box-sizing: border-box; min-height: 36px; }
  .price { font-size: 38px; font-weight: 600; letter-spacing: -0.6px; line-height: 1.05; }
  .lines { display: flex; flex-direction: column; gap: 7px; font-size: 13px; }
  .lines .l { display: flex; justify-content: space-between; gap: 12px; }
  .lines .l.tot { border-top: 1px solid var(--line); padding-top: 7px; font-weight: 600; }
  .metabar { display: flex; align-items: center; gap: 8px; }
  .metabar .track { width: 90px; position: relative; overflow: visible; }
  .metabar .track > b { position: absolute; top: -3px; width: 2px; height: 15px; background: var(--ink); }

  /* memória de cálculo */
  .memo-grid { columns: 2; column-gap: var(--gap); }
  .memo-grid .card { display: block; break-inside: avoid; margin: 0 0 var(--gap); }
  .memo-grid .card h2 { margin-bottom: 12px; }
  .memo { display: flex; flex-direction: column; gap: 10px; font-size: 13.5px; line-height: 1.65; color: var(--ink-2); }
  .memo p { margin: 0; }
  .memo b { color: var(--ink); }
  .memo ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
  .memo code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; background: var(--panel); padding: 1px 5px; color: var(--ink); }
  .footlink { font-size: 12px; color: var(--muted); text-align: center; border-top: 1px solid var(--line); padding-top: 20px; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #FFFFFF; padding: 10px 16px; border-radius: 3px; font-size: 13px; z-index: 50; max-width: 90vw; }
  .modal { position: fixed; inset: 0; background: rgba(47,46,46,0.5); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
  .modal .box { background: var(--ground); border-radius: 3px; padding: 24px; width: min(640px, 100%); display: flex; flex-direction: column; gap: 12px; }
  .modal textarea { width: 100%; height: 220px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; box-sizing: border-box; }

  .bottomnav { display: none; }
  @media (max-width: 1100px) {
    :root { --gap: 24px; --gap-y: 32px; }
    .memo-grid { columns: 1; }
    .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid21, .grid3, .grid2, .sim { grid-template-columns: minmax(0, 1fr); }
    .kpi .val { font-size: 28px; }
    .tabs { gap: 18px; }
  }
  @media (max-width: 760px) {
    :root { --gap: 20px; --gap-y: 28px; }
    .top { position: static; }
    .draft { min-height: 40px; font-size: 11px; gap: 8px; }
    .draft b { font-size: 12px; letter-spacing: 2px; }
    .top-in { padding: 0 16px; height: 60px; }
    .brand .word { font-size: 22px; }
    .brand .sub, .tabs, .status { display: none; }
    .wrap { padding: 22px 16px 104px; }
    .titlebar h1 { font-size: 19px; }
    .titlebar .src { display: none; }
    .grid4 { gap: 16px 20px; }
    .kpi { min-height: 0; padding-top: 12px; }
    .kpi .val { font-size: 24px; }
    .kpi .note { display: none; }
    .rowh { display: none; }
    .row { grid-template-columns: minmax(0, 1fr) 58px 76px; gap: 0 10px; min-height: 44px; border-bottom: 1px solid var(--line); }
    .row.r5, .rowh.r5 { grid-template-columns: minmax(0, 1fr) 62px 82px; }
    .row.r5 .ap { display: none; }
    .rows { gap: 0; }
    .row .bar { display: none; }
    .row .name { white-space: normal; font-weight: 500; }
    .hm { display: none !important; }
    .hours { grid-template-columns: 90px minmax(0, 1fr) minmax(0, 1fr); }
    .footlink { padding-top: 16px; }
    .bottomnav { display: grid; position: fixed; left: 0; right: 0; bottom: 0; height: 72px; background: var(--ground); border-top: 1px solid var(--line); grid-template-columns: repeat(6, minmax(0, 1fr)); align-items: center; padding: 0 2px; box-sizing: border-box; z-index: 5; }
    .navitem { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 44px; font-size: 9px; font-weight: 500; color: var(--muted); background: none; border: 0; cursor: pointer; letter-spacing: 0.2px; }
    .navitem[aria-selected="true"] { color: var(--red); font-weight: 600; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<style>

  #gate .box { background: #FFFFFF; border-top: 3px solid #D0151C; border-bottom: 1px solid #E4E2DF; padding: 28px 0 32px; width: min(420px, 100%); display: flex; flex-direction: column; gap: 16px; box-sizing: border-box; }
  #gate .word { font-family: "Playfair Display", Georgia, serif; font-weight: 700; font-size: 30px; color: #D0151C; letter-spacing: 1px; }
  #gate .sub { font-size: 11px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: #6F6D6B; }
  #gate p { margin: 0; font-size: 14px; line-height: 1.5; color: #6F6D6B; }
  #gate input { border: 1px solid #C7C5C2; border-radius: 3px; padding: 12px 14px; font: inherit; font-size: 15px; min-height: 48px; box-sizing: border-box; width: 100%; }

</style>
<div id="gate"><form class="box" id="gate-form" autocomplete="off">
  <div><div class="word">DINIZ</div><div class="sub">Contabilidade Digital · painel gerencial</div></div>
  <p>Prévia em construção, com os dados de junho/2026. Digite a senha para abrir.</p>
  <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6F6D6B">Senha<input type="password" id="gate-pw" required autofocus aria-label="Senha"></label>

<script>

  // ---------- simulador ----------
  function simular() {
    const c = state.calc; if (!c) return null; const s = state.sim;
    const sel = AREAS.filter(a => s.servicos[a]); if (!sel.length) return null;
    const regime = s.regime; const F = num(s.funcionarios), N = num(s.notas);
    let base = c.clientes.filter(x => sel.every(a => (x.horasArea[a] || 0) > 0)); if (base.length < 3) base = c.clientes.filter(x => sel.some(a => (x.horasArea[a] || 0) > 0));
    if (regime) { const r = base.filter(x => norm(x.regime) === norm(regime)); if (r.length >= 3) base = r; }
    if (F != null && F > 0 && c.hasF) { const r = base.filter(x => x.funcionarios != null && x.funcionarios >= F * 0.5 && x.funcionarios <= F * 1.5); if (r.length >= 3) base = r; }
    if (N != null && N > 0 && c.hasN) { const r = base.filter(x => x.notas != null && x.notas >= N * 0.5 && x.notas <= N * 1.5); if (r.length >= 3) base = r; }
    const linhas = sel.map(a => {
      const com = base.filter(x => (x.horasArea[a] || 0) > 0); const medAp = median(com.map(x => x.horasArea[a])) || 0; const medEst = median(com.map(x => x.horasEstArea[a])) || medAp;
      const ar = c.areas.find(z => z.area === a); const custoHora = ar ? ar.custoHora : c.custoHoraMedio;
      const manual = s.horas[a]; const horas = manual != null && manual !== '' && Number.isFinite(+manual) ? +manual : Math.round(medEst * 10) / 10;
      return { area: a, horas, custoHora, custo: horas * custoHora, medAp, medEst, n: com.length, manual: manual != null && manual !== '' };
    });
    const direto = linhas.reduce((t, l) => t + l.custo, 0); const indiretos = direto * c.taxa; const custo = direto + indiretos;
    const margem = s.margem != null && s.margem !== '' ? (+s.margem) / 100 : (+state.config.margem_alvo || 0.3);
    const aliq = s.aliq != null && s.aliq !== '' ? (+s.aliq) / 100 : c.aliq;
    const den = 1 - aliq - margem; const preco = den > 0 ? custo / den : null; const minimo = (1 - aliq) > 0 ? custo / (1 - aliq) : null;
    const comHon = base.filter(x => x.honorario != null); const honMediana = median(comHon.map(x => x.honorario));
    const similares = base.slice().sort((a, b) => b.estTotal - a.estTotal).slice(0, 12);
    return { sel, linhas, direto, indiretos, custo, margem, aliq, preco, minimo, honMediana, nHon: comHon.length, similares, nBase: base.length, taxa: c.taxa };
  }

  function renderTendencia(ks) {
    const pts = ks.map(k => { const c = calcular(state.meses[k], state.config); return { k, receita: c.receita, folha: c.folhaOp, cob: c.cobertura }; });
    const W = 360, H = 170, padL = 8, padR = 8, padT = 14, padB = 34; const n = pts.length; const gw = (W - padL - padR) / n; const mx = Math.max(1, ...pts.flatMap(p => [p.receita, p.folha])); const y = v => padT + (H - padT - padB) * (1 - v / mx);
    let s = `<svg class="svgchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Receita e folha operacional por mês">`;
    pts.forEach((p, i) => { const x0 = padL + i * gw; const bw = Math.min(34, gw * 0.3);
      s += `<rect x="${(x0 + gw / 2 - bw - 1).toFixed(1)}" y="${y(p.receita).toFixed(1)}" width="${bw}" height="${(H - padB - y(p.receita)).toFixed(1)}" fill="#2F2E2E" rx="2"><title>${esc(mesLabel(p.k))}: receita ${esc(fBRL0(p.receita))}</title></rect><rect x="${(x0 + gw / 2 + 1).toFixed(1)}" y="${y(p.folha).toFixed(1)}" width="${bw}" height="${(H - padB - y(p.folha)).toFixed(1)}" fill="#D0151C" rx="2"><title>${esc(mesLabel(p.k))}: folha operacional ${esc(fBRL0(p.folha))}</title></rect><text x="${(x0 + gw / 2).toFixed(1)}" y="${H - padB + 14}" text-anchor="middle" font-size="10" fill="#6F6D6B">${esc(mesLabel(p.k).slice(0, 3))}/${p.k.slice(2, 4)}</text><text x="${(x0 + gw / 2).toFixed(1)}" y="${H - padB + 27}" text-anchor="middle" font-size="10" fill="#2F2E2E" font-weight="600">${esc(fPct(p.cob))}</text>`; });
    s += `<line x1="${padL}" x2="${W - padR}" y1="${H - padB}" y2="${H - padB}" stroke="#E8E6E6"></line></svg><div class="legend"><span><i class="sw" style="background:#2F2E2E"></i>Receita de serviços</span><span><i class="sw" style="background:#D0151C"></i>Folha operacional</span><span>% = cobertura do apontamento</span></div>`;
    return s;
  }

  function renderClientes() {

    const key = state.sortCli; const dir = state.sortDir;
    lista = [...lista].sort((a, b) => { const va = a[key] == null ? -Infinity : (typeof a[key] === 'string' ? a[key] : +a[key]); const vb = b[key] == null ? -Infinity : (typeof b[key] === 'string' ? b[key] : +b[key]); return (va < vb ? -1 : va > vb ? 1 : 0) * dir; });

        <div class="card kpi"><div class="lbl">Com honorário cadastrado</div><div class="val num ${c.semHon ? 'warntxt' : 'goodtxt'}">${c.clientes.length - c.semHon}<span style="font-size:18px;color:var(--muted)"> de ${c.clientes.length}</span></div><div class="note">${c.clientes.length - c.semCad} com regime, funcionários ou notas</div></div>
        <div class="card kpi"><div class="lbl">Margem ${est ? 'estimada' : 'apontada'} negativa</div><div class="val num ${c.margemNeg ? 'redtxt' : ''}">${est ? c.margemNeg : c.clientes.filter(x => x.margem != null && x.margem < 0).length}</div><div class="note">honorário abaixo do custo</div></div>
      </section>
      <section class="grid2">
        <div class="card">
          <div class="card-head"><h2>Como a carteira se distribui</h2>${btnExport('faixas')}</div>
          <div class="areas">${c.faixas.map((f, i) => `<div class="area" style="grid-template-columns:110px minmax(0,1fr) 90px"><span>${f.f}</span><div class="track"><span style="width:${(f.n / mx * 100).toFixed(1)}%;background:${i === 3 ? 'var(--red)' : 'var(--ink)'}"></span></div><span class="r num ${i === 3 ? 'redtxt b' : 'mutedtxt'}">${f.n} clientes</span></div>`).join('')}</div>
          <div class="explain">Por horas apontadas no mês.</div>
        </div>
        <div class="card">
          <h2>Base do custo e margem</h2>
          <div class="lines">
            <div class="l"><span>Custo usado na margem</span><span class="seg" role="group" aria-label="Base do custo"><button data-base="apontado" aria-pressed="${!est}">Apontado</button><button data-base="estimado" aria-pressed="${est}">Estimado</button></span></div>

            <div class="l"><span>Impostos sobre o honorário</span><span class="b num">${fPct(c.aliq, 1)}</span></div>
            <div class="l"><span>Taxa de custos indiretos</span><span class="b num">${fPct(c.taxa, 1)}</span></div>
          </div>
          <div class="explain">Estimado = apontado + rateio dos ${fMil(c.naoAlocado)} não alocados. Margem = honorário − impostos − custo. O honorário digitado na tabela fica salvo para os próximos meses. <a href="#" data-tab="bases">Cadastro em Excel</a></div>
        </div>
      </section>
      <div class="card">
        <div class="card-head">
          <div class="filters"><input class="search" id="busca" placeholder="Buscar cliente ou código" value="${esc(state.busca)}" aria-label="Buscar"><label class="chk"><input type="checkbox" id="soneg" ${state.soNeg ? 'checked' : ''}> Só margem negativa</label><span class="mini">${lista.length} de ${c.clientes.length}</span></div>
          ${btnExport('clientes', state.downloads ? 'Excel (todos)' : 'Copiar (todos)')}
        </div>
        <div class="tablewrap"><table>
          <thead><tr>${th('rank', '#', 'r')}${th('cod', 'Cód.')}${th('nome', 'Cliente')}<th class="hm">Regime</th>${areaOrder().map(a => `<th class="r hm" title="Horas apontadas e custo ${est ? 'estimado' : 'apontado'} em ${esc(a)}"><i class="sw" style="background:${AREA_COLOR[a] || OUTRA_COLOR};vertical-align:middle"></i> ${esc(a.slice(0, 4))}</th>`).join('')}${th('horas', 'Horas', 'r', 'Horas apontadas')}${th('total', 'Apontado', 'r hm', 'Custo apontado com indiretos')}${th('estTotal', 'Estimado', 'r', 'Custo apontado + rateio do não alocado')}<th class="r">Honorário (R$)</th>${th(est ? 'margemEst' : 'margem', 'Margem', 'r')}${th(est ? 'margemEstPct' : 'margemPct', '%', 'r')}</tr></thead>
          <tbody>${lista.map(x => { const m = est ? x.margemEst : x.margem, mp = est ? x.margemEstPct : x.margemPct; return `<tr data-row="${x.cod}" class="${m != null && m < 0 ? 'neg' : ''} ${x.cod === 1 ? 'int' : ''}"><td class="r num">${x.rank}</td><td class="num">${x.cod}</td><td class="name">${esc(x.nome)}${x.funcionarios != null || x.notas != null ? `<br><span class="mini">${x.funcionarios != null ? x.funcionarios + ' func.' : ''}${x.funcionarios != null && x.notas != null ? ' · ' : ''}${x.notas != null ? x.notas + ' notas' : ''}</span>` : ''}</td><td class="mini hm">${esc(x.regime || '—')}</td>${areaOrder().map(a => `<td class="r hm"><div class="twin num"><span>${x.horasArea[a] ? fH(x.horasArea[a]).replace(' h', '') : '–'}</span><small>${x.horasArea[a] ? fBRL0(est ? x.custoEstArea[a] : (x.custoArea[a] || 0) * (1 + c.taxa)) : ''}</small></div></td>`).join('')}<td class="r num">${fH(x.horas)}</td><td class="r num mutedtxt hm">${fBRL0(x.total)}</td><td class="r num b">${fBRL0(x.estTotal)}</td><td class="r"><input class="money num" type="number" min="0" step="1" inputmode="decimal" data-hon="${x.cod}" value="${x.honorario == null ? '' : x.honorario}" placeholder="—" aria-label="Honorário de ${esc(x.nome)}"></td><td class="r num mg ${m == null ? 'mutedtxt' : m < 0 ? 'redtxt b' : 'goodtxt b'}">${m == null ? '—' : fBRL0(m)}</td><td class="r num mgp">${pillMargem(mp)}</td></tr>`; }).join('')}</tbody>
        </table></div>
        <div class="explain">Nas colunas de área: horas apontadas em cima, custo ${est ? 'estimado' : 'apontado'} embaixo. Clique no cabeçalho para ordenar.</div>
      </div>`;

      </section>`;
  }

        <div class="card">

  function renderMemoria() {
    const c = state.calc; const cfg = state.config; const doc = state.meses[state.mes] || {}; const o = doc.origem || {};
    const ops = c.colabs.filter(x => x.tipo === 'Operacional'); const ap = c.colabs.filter(x => x.tipo === 'Apoio');
    const ex = c.colabs.find(x => x.tipo === 'Operacional' && x.horas > 0) || ops[0];
    const top = c.clientes[0]; const excl = (cfg.indiretos_excluir || []); const grupos = (c.dre.despesas || []);
    const inc = grupos.filter(g => !excl.includes(String(g.cod))), out = grupos.filter(g => excl.includes(String(g.cod)));
    const mapa = Object.entries(cfg.mapa_nomes || {});
    const sec = (t, body) => `<div class="card"><h2>${t}</h2><div class="memo">${body}</div></div>`;
    return `
      <div class="titlebar"><h1>Memória de cálculo</h1><div class="src">Como cada número de ${esc(mesLabel(state.mes).toLowerCase())} foi construído. Os valores abaixo são os do mês selecionado.</div></div>
      <div class="memo-grid">
      ${sec('1. Fontes e leitura dos arquivos', `
        <p><b>Temporizador com Área</b> (${esc(o.temporizador || 'CSV')}): arquivo separado por ponto e vírgula, codificado em Latin-1. Cada bloco começa com "código - nome do cliente"; o bloco "Sem vínculo com empresa" recebe código 0. De cada linha lemos área, usuário e o tempo <b>líquido</b> (bruto menos distorção), convertido de hh:mm:ss para horas decimais. Linhas de total são ignoradas. Resultado: ${(doc.apontamentos || []).length} apontamentos, ${fH(c.horasApont)}.</p>
        <p><b>Custo Mensal por Colaborador</b> (${esc(o.custo || 'XLS')}): aba CUSTOS, coluna <code>CUSTO POR FUNCIONÁRIO</code>, que já soma salário, encargos, provisões de férias e 13º, FGTS e benefícios. Lemos código, nome, setor e esse custo. Linhas sem custo (por exemplo, um nome sem valor) ficam de fora. Resultado: ${c.colabs.length} colaboradores, folha total ${fBRL(c.folhaTotal)}.</p>
        <p><b>Demonstrativo de receitas e despesas</b> (${esc(o.dre || 'XLSX')}): lemos a coluna do mês. Guardamos as receitas até o segundo nível, os grupos de despesa (código de dois dígitos) e as linhas de DAS e ISS. Valores entre parênteses são negativos.</p>
        <p>Nomes de clientes e colaboradores são exibidos com iniciais maiúsculas apenas por leitura; os códigos são a chave.</p>`)}
      ${sec('2. Custo-hora de cada colaborador', `
        <p><code>custo-hora = custo mensal total ÷ horas-base</code>. Horas-base em uso: <b>${c.hb} h</b> por mês (${cfg.horas_base === 176 ? '44 h semanais × 4 semanas' : 'valor definido na aba Bases'}). A planilha original da Diniz divide por 212,5 h no salário-hora; aqui usamos a hora efetivamente disponível, porque o objetivo é custo por hora trabalhada.</p>
        ${ex ? `<p>Exemplo: ${esc(titleCase(ex.nome))} custa ${fBRL(ex.custo)} no mês ÷ ${c.hb} h = <b>${fBRL(ex.custoHora)}/h</b>.</p>` : ''}
        <p><b>Operacional × apoio.</b> Setores ${esc((cfg.setores_apoio || []).map(titleCase).join(' e '))} são apoio: ${ap.length} pessoas, ${fBRL(c.folhaApoio)}. Os demais são operacionais: ${ops.length} pessoas, ${fBRL(c.folhaOp)}. Só o custo dos operacionais vai direto para os clientes pelas horas; o apoio entra na taxa de indiretos.</p>`)}
      ${sec('3. Vínculo entre o nome do temporizador e a folha', `
        <p>Os nomes não são idênticos nos dois sistemas. A regra automática compara os nomes sem acentos, espaços e maiúsculas: aceita igualdade, um nome contido no outro, ou primeiro e último nome iguais. ${mapa.length ? `Vínculos definidos manualmente: ${mapa.map(([u, k]) => { const col = c.colabs.find(x => String(x.cod) === String(k)); return esc(u) + ' → ' + esc(col ? titleCase(col.nome) : k); }).join('; ')}.` : 'Nenhum vínculo manual em uso.'} Horas de um nome sem vínculo ficam com custo zero e aparecem como alerta.</p>`)}
      ${sec('4. Custo apontado por cliente', `
        <p><code>custo direto = Σ (horas apontadas × custo-hora de quem apontou)</code>, somado por área. <code>custos indiretos = custo direto × taxa</code>. <code>custo apontado = direto + indiretos</code>.</p>
        <p><b>Taxa de indiretos = (despesas indiretas do DRE + folha de apoio) ÷ folha operacional</b> = (${fBRL(c.indiretosDRE)} + ${fBRL(c.folhaApoio)}) ÷ ${fBRL(c.folhaOp)} = <b>${fPct(c.taxa, 1)}</b>.</p>
        <p>Despesas indiretas do DRE somam os grupos ${inc.map(g => esc(g.cod)).join(', ')} (${esc(inc.map(g => titleCase(g.desc)).join(', '))}). Ficam de fora: ${out.map(g => esc(g.cod) + ' ' + esc(titleCase(g.desc))).join('; ')}. Motivo: 01 já está na folha dos colaboradores; 11 são impostos, tratados como percentual do honorário; 12 é distribuição de lucros, não custo; 14 são aquisições, investimento e não despesa do mês.</p>
        ${top ? `<p>Exemplo, ${esc(top.nome)}: ${fH(top.horas)} apontadas, custo direto ${fBRL(top.direto)}, indiretos ${fBRL(top.indiretos)}, custo apontado <b>${fBRL(top.total)}</b> (${fBRL(top.custoHora)}/h).</p>` : ''}`)}
      ${sec('5. Cobertura, capacidade e o que não foi apontado', `
        <p><code>capacidade = operacionais × horas-base</code> = ${ops.length} × ${c.hb} = <b>${c.capacidade.toLocaleString('pt-BR')} h</b>. <code>cobertura = horas apontadas ÷ capacidade</code> = ${fH(c.horasApont)} ÷ ${c.capacidade.toLocaleString('pt-BR')} h = <b>${fPct(c.cobertura)}</b>. Meta por pessoa: ${fPct(c.meta)}.</p>
        <p>A folha operacional se divide em: apontado em clientes ${fBRL(c.custoCli)}, apontado sem vínculo ${fBRL(c.custoSV)}, e <b>não apontado ${fBRL(c.custoNaoApont)}</b> (folha operacional menos o custo apontado pelos operacionais). "Custo por hora apontada" (${fBRL(c.custoPorHoraApont)}) é a folha operacional dividida só pelas horas apontadas: mostra quanto cada hora registrada teria que absorver se o registro fosse completo.</p>`)}
      ${sec('6. Custo estimado por cliente', `
        <p>Como o apontamento cobre ${fPct(c.cobertura)} do tempo, o custo apontado subestima o custo real. O custo estimado devolve aos clientes o <b>não alocado</b> = não apontado + sem vínculo = ${fBRL(c.custoNaoApont)} + ${fBRL(c.custoSV)} = <b>${fBRL(c.naoAlocado)}</b>.</p>
        <p>Rateio em uso: <b>${driverLabel(c.driver)}</b>. Regras: no modo automático usa-se só horas apontadas até que funcionários ou notas estejam preenchidos em pelo menos 80% dos clientes (hoje funcionários ${fPct(c.covF)}, notas ${fPct(c.covN)}); quando um critério entra, cada cliente recebe a média das suas participações em cada critério. Forçando um critério na aba Bases, quem não tem o dado recebe a mediana dos que têm.</p>
        <p><code>custo estimado = (custo direto + participação × não alocado) × (1 + taxa)</code>. As horas e os custos por área são escalados pelo mesmo fator do cliente. ${top ? `Exemplo, ${esc(top.nome)}: participação ${fPct(top.peso, 2)} × ${fBRL(c.naoAlocado)} = ${fBRL(top.rateio)} de rateio; (${fBRL(top.direto)} + ${fBRL(top.rateio)}) × ${(1 + c.taxa).toFixed(3)} = <b>${fBRL(top.estTotal)}</b>.` : ''}</p>
        <p>Limite conhecido: com cobertura baixa, o rateio por horas premia quem apontou mais e pode exagerar clientes grandes. O número certo só aparece quando a cobertura sobe ou quando o cadastro traz funcionários e notas para todos.</p>`)}
      ${sec('7. Impostos e margem', `
        <p><code>impostos sobre honorário = (DAS + ISS) ÷ receita de serviços</code> = (${fBRL(c.dre.das)} + ${fBRL(c.dre.iss)}) ÷ ${fBRL(c.receita)} = <b>${fPct(c.aliq, 2)}</b>. Receita de serviços = grupo 01.01 Serviços técnicos menos 01.01.07 Receitas financeiras (${fBRL(c.dre.receitas_financeiras)}, que inclui empréstimo de sócios e rendimentos e não é venda). O DAS pago no mês se refere à competência anterior; a aproximação é aceitável enquanto a receita for estável.</p>
        <p><code>margem = honorário − impostos − custo</code>, calculada sobre o custo apontado e sobre o estimado; a aba Clientes mostra a base escolhida. Cores: vermelho abaixo de zero, âmbar abaixo de 15%, verde acima.</p>`)}
      ${sec('8. Simulador de preço', `
        <p><b>Custo-hora efetivo por área</b> = custo apontado na área ÷ horas apontadas na área, ou seja, a mistura real de quem faz o trabalho: ${c.areas.map(a => esc(a.area) + ' ' + fBRL(a.custoHora)).join(' · ')}.</p>
        <p><b>Clientes parecidos</b>: os que têm horas em todos os serviços escolhidos (ou em algum deles, se forem menos de três); depois, se houver cadastro, o mesmo regime, funcionários entre metade e uma vez e meia do informado, e notas na mesma faixa. Só filtros que deixem pelo menos três clientes são aplicados.</p>
        <p><b>Horas sugeridas</b> por serviço = mediana das horas estimadas (item 6) dos clientes parecidos. <code>custo total = Σ horas × custo-hora efetivo × (1 + taxa)</code>. <code>preço = custo total ÷ (1 − impostos − margem alvo)</code>, o que garante que, do preço, saiam os impostos e sobre a margem escolhida sobre o preço. Preço mínimo é o mesmo cálculo com margem zero. Margem alvo padrão: ${fPct(cfg.margem_alvo || 0.3)}.</p>`)}
      ${sec('9. Alertas, faixas e outras convenções', `
        <ul>
          <li>Faixas de horas: menos de 1 h, 1 a 5 h, 5 a 15 h, mais de 15 h, sempre sobre horas apontadas no mês.</li>
          <li>Alertas: clientes com menos de 1 h; operacionais abaixo da meta de cobertura; nomes sem vínculo; honorário ausente; margem estimada negativa.</li>
          <li>O cliente de código 1 é a própria Diniz e aparece como uso interno.</li>
          <li>Colaboradores de apoio que apontam horas (por exemplo, RH) têm essas horas custeadas normalmente; o restante do custo deles fica na taxa de indiretos.</li>
          <li>Horas são guardadas com quatro casas decimais; valores em reais com duas. Pequenas diferenças de centavos entre painel e planilha vêm desse arredondamento.</li>
          <li>Parâmetros ajustáveis na aba Bases: horas-base, meta de cobertura, margem alvo, critério de rateio, setores de apoio, grupos do DRE fora dos indiretos e vínculos de nomes. Tudo o que muda ali recalcula o painel inteiro.</li>
        </ul>`)}
      </div>`;
  }

  function renderTabs() {
    document.getElementById('tabs').innerHTML = TABS.map(t => `<button class="tab ${t.discreto ? 'discreto' : ''}" role="tab" data-tab="${t.id}" aria-selected="${state.tab === t.id}">${t.label}</button>`).join('');
    document.getElementById('bottomnav').innerHTML = TABS.filter(t => !t.discreto).map(t => `<button class="navitem" role="tab" data-tab="${t.id}" aria-selected="${state.tab === t.id}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${t.icon}</svg><span>${t.short}</span></button>`).join('');
    const sel = document.getElementById('mes'); const ks = Object.keys(state.meses).sort().reverse(); sel.innerHTML = ks.map(k => `<option value="${k}" ${k === state.mes ? 'selected' : ''}>${esc(mesLabel(k))}</option>`).join('');
    document.getElementById('status').innerHTML = `<span class="dot ${state.dbOk ? 'on' : ''}"></span><span>${state.dbOk ? 'banco compartilhado' : 'dados locais'}</span>`;
    document.getElementById('btn-tudo').querySelector('span').textContent = state.downloads ? 'Exportar tudo' : 'Copiar tudo';
  }
  function render() {
    renderTabs(); for (const t of TABS) document.getElementById('tab-' + t.id).hidden = state.tab !== t.id;
    const el = document.getElementById('tab-' + state.tab);
    if (!state.calc) { el.innerHTML = '<div class="card"><div class="empty"><div class="t1">Nenhum mês carregado</div><div class="t2">Envie as três bases na aba Bases.</div></div></div>'; return; }
    el.innerHTML = ({ visao: renderVisao, clientes: renderClientes, precificar: renderPrecificar, equipe: renderEquipe, financeiro: renderFinanceiro, bases: renderBases, memoria: renderMemoria })[state.tab]() + (state.tab === 'memoria' ? '' : `<div class="footlink"><a href="#" data-tab="memoria">Memória de cálculo</a> · como cada número deste painel é calculado</div>`);
    if (state.tab === 'precificar') { renderSimHours(); renderSimOut(); }
    try { history.replaceState(null, '', '#' + state.tab); } catch (e) { }
  }
  function recalc() { const doc = state.mes && state.meses[state.mes]; state.calc = doc ? calcular(doc, state.config) : null; render(); }

  // ---------- eventos ----------
  document.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-tab]'); if (t) { e.preventDefault(); state.tab = t.dataset.tab; render(); window.scrollTo({ top: 0 }); return; }
    const x = e.target.closest('[data-export]'); if (x) { const k = x.dataset.export; if (EXPORTS[k]) exportar(k === 'cadastro' ? 'modelo-cadastro' : k, EXPORTS[k](state.calc)); return; }
    if (e.target.closest('#btn-tudo')) { if (state.calc) exportarTudo(); return; }
    const s = e.target.closest('th[data-sort]'); if (s) { const k = s.dataset.sort; if (state.sortCli === k) state.sortDir *= -1; else { state.sortCli = k; state.sortDir = (k === 'nome' || k === 'rank' || k === 'cod') ? 1 : -1; } render(); return; }
    const b = e.target.closest('[data-base]'); if (b) { state.base = b.dataset.base; if (state.sortCli === 'margem' || state.sortCli === 'margemEst') state.sortCli = state.base === 'estimado' ? 'margemEst' : 'margem'; if (state.sortCli === 'margemPct' || state.sortCli === 'margemEstPct') state.sortCli = state.base === 'estimado' ? 'margemEstPct' : 'margemPct'; render(); return; }
    const sv = e.target.closest('[data-serv]'); if (sv) { const a = sv.dataset.serv; state.sim.servicos[a] = !state.sim.servicos[a]; sv.setAttribute('aria-pressed', String(!!state.sim.servicos[a])); renderSimHours(); renderSimOut(); return; }
    if (e.target.closest('#sim-reset')) { state.sim.horas = {}; state.sim.margem = null; state.sim.aliq = null; render(); return; }
    const d = e.target.closest('[data-del]'); if (d) { const k = d.dataset.del; if (confirm('Remover ' + mesLabel(k) + ' do painel?')) removerMes(k); return; }
    if (e.target.closest('[data-close]')) { modal(null); return; }
    if (e.target.closest('#btn-limpar')) { state.upload = { mes: '', temporizador: null, custo: null, dre: null }; render(); return; }
    if (e.target.closest('#btn-salvar')) { await salvarUpload(); return; }
    if (e.target.closest('#btn-cfg')) {
      const hb = +document.getElementById('cfg-hb').value; if (hb > 0) state.config.horas_base = hb;
      const meta = +document.getElementById('cfg-meta').value; if (meta > 0) state.config.meta_cobertura = meta / 100;
      const mg = +document.getElementById('cfg-margem').value; if (mg >= 0) state.config.margem_alvo = mg / 100;
      state.config.rateio = document.getElementById('cfg-rateio').value;
      state.config.setores_apoio = document.getElementById('cfg-apoio').value.split(',').map(v => v.trim().toUpperCase()).filter(Boolean);
      state.config.indiretos_excluir = document.getElementById('cfg-excl').value.split(',').map(v => v.trim()).filter(Boolean);
      await salvarConfig(); recalc(); toast('Parâmetros aplicados'); return;
    }
    if (e.target.closest('#cfg-clearmap')) { e.preventDefault(); state.config.mapa_nomes = {}; await salvarConfig(); recalc(); return; }
  });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'busca') { state.busca = e.target.value; render(); const nb = document.getElementById('busca'); if (nb) { nb.focus(); nb.setSelectionRange(nb.value.length, nb.value.length); } return; }
    if (e.target.id === 'sim-func') { state.sim.funcionarios = e.target.value; renderSimHours(); renderSimOut(); return; }
    if (e.target.id === 'sim-notas') { state.sim.notas = e.target.value; renderSimHours(); renderSimOut(); return; }
    if (e.target.id === 'sim-margem') { state.sim.margem = e.target.value; renderSimOut(); return; }
    if (e.target.id === 'sim-aliq') { state.sim.aliq = e.target.value; renderSimOut(); return; }
    const sh = e.target.closest('[data-simh]'); if (sh) { state.sim.horas[sh.dataset.simh] = sh.value; renderSimOut(); return; }
  });
  document.addEventListener('change', async (e) => {
    if (e.target.id === 'mes') { state.mes = e.target.value; recalc(); return; }
    if (e.target.id === 'soneg') { state.soNeg = e.target.checked; render(); return; }
    if (e.target.id === 'up-mes') { state.upload.mes = e.target.value; render(); return; }
    if (e.target.id === 'sim-regime') { state.sim.regime = e.target.value; renderSimHours(); renderSimOut(); return; }
    const h = e.target.closest('[data-hon]'); if (h) { const cod = h.dataset.hon; const v = h.value === '' ? null : +h.value; state.cadastro[cod] = state.cadastro[cod] || {}; if (v == null) delete state.cadastro[cod].honorario; else state.cadastro[cod].honorario = v; salvarCadastro(); recalcRow(h.closest('tr'), cod); return; }
    const m = e.target.closest('[data-map]'); if (m) { const u = m.dataset.map; if (m.value) { state.config.mapa_nomes = state.config.mapa_nomes || {}; state.config.mapa_nomes[u] = +m.value; await salvarConfig(); recalc(); toast('Vínculo salvo'); } return; }
    const up = e.target.closest('[data-up]'); if (up && up.files && up.files[0]) { await lerArquivo(up.dataset.up, up.files[0]); return; }
  });
  function recalcRow(row, cod) {
    state.calc = calcular(state.meses[state.mes], state.config); const x = state.calc.clientes.find(c => String(c.cod) === String(cod)); if (!x || !row) return;
    const est = state.base === 'estimado'; const m = est ? x.margemEst : x.margem, mp = est ? x.margemEstPct : x.margemPct;
    const mc = row.querySelector('.mg'), pc = row.querySelector('.mgp');
    if (mc) { mc.className = 'r num mg ' + (m == null ? 'mutedtxt' : m < 0 ? 'redtxt b' : 'goodtxt b'); mc.textContent = m == null ? '—' : fBRL0(m); }
    if (pc) pc.innerHTML = pillMargem(mp); row.classList.toggle('neg', m != null && m < 0);
  }
  async function lerArquivo(kind, file) {
    try {
      const buf = await file.arrayBuffer(); let r;
      if (kind === 'cadastro') { r = parseCadastro(buf); for (const [k, e] of Object.entries(r.cadastro)) state.cadastro[k] = Object.assign({}, state.cadastro[k] || {}, e); await salvarCadastro(true); recalc(); toast(`Cadastro atualizado: ${r.n} clientes, ${r.nh} com honorário`, 5000); return; }
      if (kind === 'temporizador') { r = parseTemporizador(decodeText(buf)); r.resumo = `${r.apontamentos.length} apontamentos · ${new Set(r.apontamentos.filter(a => a[0] > 0).map(a => a[0])).size} clientes · ${fH(r.apontamentos.reduce((s, a) => s + a[4], 0))}`; }
      else if (kind === 'custo') { r = parseCusto(buf, file.name); r.resumo = `${r.colaboradores.length} colaboradores · folha ${fBRL0(r.colaboradores.reduce((s, c) => s + c.custo, 0))}`; }
      else { r = parseDRE(buf); r.resumo = `receita de serviços ${fBRL0(r.dre.receita_servicos)} · ${r.dre.despesas.length} grupos de despesa`; }
      r.arquivo = file.name; state.upload[kind] = r; if (!state.upload.mes && r.mes) state.upload.mes = r.mes; render(); toast('Arquivo lido: ' + file.name);
    } catch (err) { toast('Erro ao ler ' + file.name + ': ' + (err.message || err), 6000); }
  }
  async function salvarUpload() {
    const u = state.upload; const key = u.mes; if (!key) { toast('Informe o mês de referência'); return; }
    const base = state.meses[key] ? clone(state.meses[key]) : { mes: key, origem: {}, apontamentos: [], colaboradores: [], dre: {} }; base.mes = key; base.origem = base.origem || {};
    if (u.temporizador) { base.apontamentos = u.temporizador.apontamentos; base.origem.temporizador = u.temporizador.arquivo; }
    if (u.custo) { base.colaboradores = u.custo.colaboradores; base.origem.custo = u.custo.arquivo; }
    if (u.dre) { base.dre = u.dre.dre; base.origem.dre = u.dre.arquivo; }
    base.origem.atualizado = new Date().toISOString().slice(0, 10);
    if (JSON.stringify(base).length > 250000) { toast('Este mês passou do limite de 256 KB do banco. Fale com o suporte do painel.', 6000); return; }
    const btn = document.getElementById('btn-salvar'); if (btn) { btn.disabled = true; btn.textContent = 'Salvando…'; }
    try { await salvarMes(base); state.upload = { mes: '', temporizador: null, custo: null, dre: null }; state.tab = 'visao'; render(); toast(mesLabel(key) + ' salvo' + (state.db ? ' no banco compartilhado' : ' neste navegador')); }
    catch (e) { toast('Não consegui salvar: ' + (e && (e.message || e.code) || e), 6000); render(); }
  }

  // ---------- inicialização ----------
  function mergeHonorarios(hon) { for (const [k, v] of Object.entries(hon || {})) { if (num(v) > 0) { state.cadastro[k] = state.cadastro[k] || {}; if (state.cadastro[k].honorario == null) state.cadastro[k].honorario = num(v); } } }
  function boot() {
    try { const fb = JSON.parse(document.getElementById('fallback-data').textContent || '{}'); if (fb && fb.mes) { state.fallback[fb.mes] = fb; state.meses[fb.mes] = fb; } } catch (e) { }
    let fbc = {}; try { fbc = JSON.parse(document.getElementById('fallback-config').textContent || '{}'); } catch (e) { }
    const lsM = lsGet(LS.meses, {}); for (const k of Object.keys(lsM)) state.meses[k] = lsM[k];
    state.config = Object.assign(clone(DEFAULT_CONFIG), fbc, lsGet(LS.config, {}));
    state.cadastro = lsGet(LS.cadastro, {}); mergeHonorarios(lsGet(LS.honorarios, {}));
    state.mes = Object.keys(state.meses).sort().pop() || null;
    const h = (location.hash || '').replace('#', ''); if (TABS.some(t => t.id === h)) state.tab = h;
    recalc();
    if (!(window.claude && typeof window.claude.use === 'function')) return;
    window.claude.use('downloads').then(d => { state.downloads = d || null; render(); }).catch(() => { });
    window.claude.use('db').then(async db => {
      if (!db) return; state.db = db; state.dbOk = true;
      try {
        const [cfg, cadDoc, hon, ms] = await Promise.all([db.doc('config/geral').get(), db.doc('config/cadastro').get(), db.doc('config/honorarios').get(), db.collection('meses').get()]);
        if (cfg.exists) state.config = Object.assign(clone(DEFAULT_CONFIG), cfg.data());
        if (cadDoc.exists) state.cadastro = clone(cadDoc.data()); else state.cadastro = {};
        if (hon.exists) mergeHonorarios(hon.data());
        for (const d of ms.docs) { const body = d.data(); if (body && body.mes) state.meses[body.mes] = body; }
        state.mes = Object.keys(state.meses).sort().pop() || null; recalc();
        db.collection('meses').onSnapshot(snap => { let changed = false; for (const ch of snap.docChanges()) { const body = ch.doc.data(); if (ch.type === 'removed') { delete state.meses[ch.doc.id]; if (state.fallback[ch.doc.id]) state.meses[ch.doc.id] = state.fallback[ch.doc.id]; changed = true; } else if (body && body.mes) { state.meses[body.mes] = body; changed = true; } } if (changed) { if (!state.meses[state.mes]) state.mes = Object.keys(state.meses).sort().pop() || null; recalc(); } }, () => { });
        const editing = () => document.activeElement && document.activeElement.dataset && (document.activeElement.dataset.hon != null || document.activeElement.dataset.simh != null);
        db.doc('config/cadastro').onSnapshot(s => { if (s.exists && !s.metadata.hasPendingWrites) { state.cadastro = clone(s.data()); if (!editing()) recalc(); } }, () => { });
        db.doc('config/geral').onSnapshot(s => { if (s.exists && !s.metadata.hasPendingWrites) { state.config = Object.assign(clone(DEFAULT_CONFIG), s.data()); if (!editing()) recalc(); } }, () => { });
      } catch (e) { toast('Banco indisponível no momento: ' + (e && (e.message || e.code) || e)); state.dbOk = false; render(); }
    }).catch(() => { });
  }
  window.PainelDiniz = { parseTemporizador, parseCusto, parseDRE, parseCadastro, calcular, simular, decodeText, state, render, boot };
  if (!window.__PAINEL_GATED__) boot();
})();
</script>
